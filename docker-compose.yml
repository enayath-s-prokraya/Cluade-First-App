version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hccp-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=hccp_super_secret_jwt_key_2024_change_in_production
      - JWT_EXPIRES_IN=24h
      - DB_PATH=/data/hccp.db
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - hccp-db:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hccp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hccp-db:
